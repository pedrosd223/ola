<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>02 — @keyframes</title>
<style>
body{font-family:Arial,sans-serif;min-height:100vh;display:flex;gap:80px;justify-content:center;align-items:center;background:#f5f1ea}
.tarjeta{padding:30px;background:white;border-radius:12px;box-shadow:0 8px 25px #0002;animation:aparecer 900ms ease-out both}
.pelota{width:60px;height:60px;background:#2aad47;border-radius:50%;animation:rebote 0.5s ease-in-out infinite}
@keyframes aparecer{
 from{opacity:0;transform:translateY(50px)}
 to{opacity:1;transform:translateY(0)}
}
@keyframes rebote{
 0%,100%{transform:translateY(0)}
 50%{transform:translateY(-80px)}
}
</style>
</head>
<body>
<div class="tarjeta"><h1></h1><p>Hola, aparezco suavemente</p></div>
<div class="pelota" title="Rebote infinito"></div>
</body>
</html>
