<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>05 — Botón de carga</title>
<style>
body{font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;background:#f5f1ea}
.boton{padding:15px 28px;border:0;border-radius:7px;background:#254e9c;color:white;cursor:pointer;font-size:16px}
.spinner{display:none;width:14px;height:14px;border:3px solid rgba(255,255,255,.4);border-top-color:white;border-radius:50%;margin-left:8px;vertical-align:middle;animation:girar .8s linear infinite}
.boton.cargando .spinner{display:inline-block}
.boton.cargando{opacity:.8;cursor:wait}
.boton.listo{background:#2eb87c}
@keyframes girar{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div>
<h1>05 · JavaScript + CSS</h1>
<button class="boton" id="enviar">Añadir al carrito <span class="spinner"></span></button>
<p id="estado"></p>
</div>
<script>
const boton = document.querySelector('#enviar');
const estado = document.querySelector('#estado');

boton.addEventListener('click', () => {
  boton.classList.add('cargando');
  boton.disabled = true;
  estado.textContent = 'Procesando...';

  setTimeout(() => {
    boton.classList.remove('cargando');
    boton.classList.add('listo');
    boton.firstChild.textContent = 'Añadido ✓ ';
    estado.textContent = 'Proceso terminado.';
  }, 2000);
});
</script>
</body>
</html>
