<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>07 — SVG Check</title>
<style>
body{font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;background:#f5f1ea}
.panel{text-align:center}
svg{width:180px;height:180px}
.aro,.marca{fill:none;stroke:#2eb87c;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;
stroke-dasharray:277;stroke-dashoffset:277}
.activo .aro{animation:trazar 700ms ease-out forwards}
.activo .marca{animation:trazar 400ms ease-out 600ms forwards}
@keyframes trazar{to{stroke-dashoffset:0}}
button{padding:12px 20px;border:0;border-radius:6px;background:#254e9c;color:white;cursor:pointer}
</style>
</head>
<body>
<div class="panel">
<h1>07 · Check SVG animado</h1>
<div id="icono">
<svg viewBox="0 0 100 100" aria-label="Proceso completado">
<circle class="aro" cx="50" cy="50" r="44"/>
<path class="marca" d="M28 52 L44 67 L72 36"/>
</svg>
</div>
<button id="reproducir">Reproducir</button>
</div>
<script>
const icono = document.querySelector('#icono');
document.querySelector('#reproducir').addEventListener('click', () => {
  icono.classList.remove('activo');
  void icono.getBoundingClientRect();
  icono.classList.add('activo');
});
</script>
</body>
</html>
