<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>01 — Transition</title>
<style>
body{font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;background:#f5f1ea}
.demo{text-align:center}
.boton{
  padding:18px 36px;
  color:#f5f1ea;
  background:#254e9c;
  border:none;
  border-radius:4px;
  cursor:pointer;
  transition:background 300ms ease, transform 300ms ease;
  font-size:18px;
}
.boton:hover{background:#2e8cff;transform:translateY(-4px)}
code{display:block;margin-top:25px;background:white;padding:15px;border-radius:8px;text-align:left}
</style>
</head>
<body>
<div class="demo">
<h1>01 · transition</h1>
<p>Pasa el ratón sobre el botón.</p>
<button class="boton">Presióname</button>
<code>transition: background 300ms ease, transform 300ms ease;</code>
</div>
</body>
</html>
